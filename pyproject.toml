[project]
name = "food-delivery-time-prediction"
version = "0.1.0"
description = "Prédiction du temps de livraison avec une régression linéaire (scikit-learn)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
]
